<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cute Weather - Admin Dashboard</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Floating Clouds Background -->
  <div class="cloud-bg" id="cloudBg"></div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1><span class="weather-icon">📊</span> Admin Dashboard</h1>
      <p class="subtitle" id="greeting">Kelola lokasi dan konfigurasi Supabase</p>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Admin Card -->
      <section class="admin-section">
        <div class="admin-card">
          <h2><span class="icon-admin">🔧</span> Data Lokasi</h2>
          
          <!-- Supabase Configuration Form -->
          <div class="config-card">
            <h3><span class="config-icon">🔑</span> Konfigurasi Supabase</h3>
            <div class="config-form">
              <input type="text" id="supabaseUrl" placeholder="Supabase Project URL" class="config-input">
              <input type="text" id="supabaseKey" placeholder="Supabase Anon Key" class="config-input">
              <button class="btn-search" id="saveConfigBtn" style="width: 100%;">
                <span>💾 Simpan Konfigurasi</span>
              </button>
            </div>
            <small class="config-hint">Masukkan URL dan kunci anon key Supabase untuk menyimpan lokasi ke database.</small>
          </div>
          
          <!-- Locations List -->
          <div class="locations-list" id="adminLocationsList">
            <p class="empty-state">Memuat lokasi...</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Cute Animal Companion -->
  <div class="animal-companion" id="animalCompanion">🦉</div>

  <!-- Supabase Client Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="scripts/app.js"></script>
  <script>
    // Initialize Supabase client from localStorage config
    function initSupabase() {
      const supabaseConfig = JSON.parse(localStorage.getItem('supabaseConfig') || 'null');
      if (supabaseConfig && supabaseConfig.url && typeof supabasejs !== 'undefined') {
        window.supabase = supabasejs.createClient(supabaseConfig.url, supabaseConfig.key);
        window.isSupabaseConfigured = true;
      }
    }
    
    // Save Supabase config
    function saveSupabaseConfig() {
      const url = document.getElementById('supabaseUrl').value;
      const key = document.getElementById('supabaseKey').value;
      
      if (!url) {
        showToast('Masukkan URL Supabase!', 'warning');
        return;
      }
      
      // Store config
      localStorage.setItem('supabaseConfig', JSON.stringify({ url, key }));
      showToast('Konfigurasi Supabase berhasil disimpan!', 'success');
      initSupabase();
      loadLocations();
    }
    
    // Load locations from Supabase
    async function loadLocations() {
      const locationsList = document.getElementById('adminLocationsList');
      
      if (!window.supabase || !window.isSupabaseConfigured) {
        locationsList.innerHTML = '<p class="empty-state">Belum ada konfigurasi Supabase. Masukkan URL dan key di atas.</p>';
        return;
      }
      
      locationsList.innerHTML = '<p class="empty-state">Memuat lokasi...</p>';
      
      try {
        const { data, error } = await window.supabase
          .from('locations')
          .select('*')
          .order('created_at', { ascending: false });
        
        if (error) {
          console.error('Supabase error:', error);
          locationsList.innerHTML = '<p class="empty-state">Gagal memuat lokasi dari database.</p>';
          return;
        }
        
        if (!data || data.length === 0) {
          locationsList.innerHTML = '<p class="empty-state">Belum ada lokasi yang disimpan</p>';
          return;
        }
        
        locationsList.innerHTML = data.map((loc, index) => `
          <div class="location-item" style="animation-delay: ${index * 0.1}s">
            <div style="display: flex; align-items: center; gap: 0.5rem;">
              <span class="icon">${getWeatherIcon('clear-day')}</span>
              <div>
                <span class="ci">${loc.name}</span>
                <small style="color: var(--text-light); display: block; font-size: 0.75rem;">(${loc.latitude.toFixed(4)}, ${loc.longitude.toFixed(4)})</small>
                <small style="color: var(--text-light); display: block; font-size: 0.75rem;">${loc.source === 'realtime' ? '📍 GPS Realtime' : '🔍 Pencarian Manual'}</small>
              </div>
            </div>
            <button class="btn-remove" data-id="${loc.id}" style="cursor: pointer; color: #e74c3c; font-size: 1rem; background: none; border: none; padding: 0.3rem 0.6rem; border-radius: 8px; transition: all 0.2s;">🗑️</button>
          </div>
        `).join('');
        
        // Add remove event listeners
        document.querySelectorAll('.btn-remove').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const id = btn.getAttribute('data-id');
            await removeLocationFromSupabase(id);
            showToast('Lokasi berhasil dihapus!', 'success');
          });
        });
      } catch (err) {
        console.error('Error:', err);
        locationsList.innerHTML = '<p class="empty-state">Gagal memuat lokasi.</p>';
      }
    }
    
    // Remove location from Supabase
    async function removeLocationFromSupabase(id) {
      if (!window.supabase) return;
      const { error } = await window.supabase
        .from('locations')
        .delete()
        .eq('id', id);
      if (error) console.error('Error removing location:', error);
      loadLocations();
    }
    
    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      initSupabase();
      loadLocations();
      updateGreeting();
      createFloatingClouds();
      initSparkleTrail();
      
      // Attach save config button
      const saveBtn = document.getElementById('saveConfigBtn');
      if (saveBtn) {
        saveBtn.addEventListener('click', saveSupabaseConfig);
      }
    });
  </script>
</body>
</html>
